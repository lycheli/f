<body>


    <screen center>
        <p small-m bold>medom</p>

            <textarea style="height:50vh;" small-p neu bbg m bdr="15" id="textInput" class="textarea" placeholder="Enter text here..."></textarea>
        
        <button id="exportBtn" small-m neu bbg m><i mid class="fa-solid fa-save"></i> </button>
    </screen>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        const { jsPDF } = window.jspdf;

document.getElementById('exportBtn').addEventListener('click', () => {
    const doc = new jsPDF();
    const text = document.getElementById('textInput').value;
    const textSize = 12;
    const margin = 10; // Margin in mm

    doc.setFontSize(textSize);

    const x = margin; // X position with margin
    const y = margin + textSize; // Y position with margin

    doc.text(text, x, y);

    const randomNumber = Math.floor(Math.random() * 1000000);
    doc.save(`${randomNumber}.pdf`);
});
    </script>
